<script>
"use strict";
/* ==========================================================
   CONTENT MODULE
   Independent companion curriculum. Pack numbers are OUR
   sequence, not claims of exact textbook lesson mapping.
   Vocabulary format: written|reading|meaning|part of speech
   Grammar: translation|space-separated tiles|blank tile index|
            three distractors separated by /|teaching note
   Add packs with addPack(); add games with registerGame().
   ========================================================== */
const PACKS=[];
function addPack(book,title,focus,words,patterns){
 const id=PACKS.length+1;
 const v=words.trim().split("\n").filter(Boolean).map((line,i)=>{
  const [jp,kana,en,type="noun"]=line.split("|");
  return {id:`p${id}v${i}`,pack:id,kind:"word",jp,kana,en,type};
 });
 const g=patterns.map((line,i)=>{
  const [en,tiles,index,other,note]=line.split("|"),tokens=tiles.split(" "),blank=Number(index);
  return {id:`p${id}g${i}`,pack:id,kind:"grammar",en,tokens,blank,answer:tokens[blank],other:other.split("/"),note,jp:tokens.join(""),kana:"",type:"pattern"};
 });
 PACKS.push({id,book,title,focus,v,g});
}

/* ==========================================================
   PROGRESS MODULE — versioned, local, exportable.
   Retention counts distinct local calendar days, not clicks.
   ========================================================== */
const KEY="hitoiki-japanese-v1";
function defaults(){return {version:1,items:{},checks:{},daily:{},prefs:{reading:true,goal:12,kana:"both"},visits:[],sessions:0}}
let S=defaults(),storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw)S=validateSave(JSON.parse(raw));}catch(e){storageOK=false}
function validateSave(o){
 if(!o||o.version!==1||!o.items||!o.checks||!o.daily||!o.prefs)throw Error("Unrecognized save format");
 const n=defaults(),date=/^\d{4}-\d{2}-\d{2}$/;
 for(const [id,x] of Object.entries(o.items)){
  if(!BYID[id]||!x||!Number.isFinite(x.wins)||x.wins<0||!Array.isArray(x.days)||!x.days.every(d=>typeof d==="string"&&date.test(d))||!Number.isFinite(x.due))throw Error("Invalid item progress");
  n.items[id]={wins:x.wins,days:[...new Set(x.days)],due:x.due,lapses:Number.isFinite(x.lapses)&&x.lapses>=0?x.lapses:0};
 }
 for(const [id,c] of Object.entries(o.checks)){
  if(!PACKS.some(p=>String(p.id)===id)||!c||!Number.isFinite(c.score)||c.score<0||c.score>1||!Number.isFinite(c.grammar)||c.grammar<0||c.grammar>4)throw Error("Invalid checkpoint");
  n.checks[id]={score:c.score,grammar:c.grammar,date:typeof c.date==="string"?c.date:""};
 }
 for(const [d,c] of Object.entries(o.daily)){if(!date.test(d)||!Number.isInteger(c)||c<0)throw Error("Invalid daily progress");n.daily[d]=c}
 n.prefs={reading:o.prefs.reading!==false,goal:[6,12,24].includes(o.prefs.goal)?o.prefs.goal:12,kana:["both","hiragana","katakana"].includes(o.prefs.kana)?o.prefs.kana:"both"};
 n.visits=Array.isArray(o.visits)?[...new Set(o.visits.filter(d=>typeof d==="string"&&date.test(d)))]:[];
 n.sessions=Number.isInteger(o.sessions)&&o.sessions>=0?o.sessions:0;
 return n;
}
function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false;toast("Progress cannot be stored here. Export a backup before leaving.")}updateHeader()}
function record(id,ok){
 const now=Date.now(),x=Object.assign({wins:0,days:[],due:0,lapses:0},S.items[id]||{});x.days=[...x.days];
 if(ok){x.wins++;const d=dayKey();if(!x.days.includes(d))x.days.push(d);x.due=now+[1,3,7,14,30][Math.min(x.days.length-1,4)]*86400000}
 else{x.lapses++;x.due=now+600000}
 S.items[id]=x;
 if(!S.visits.includes(dayKey()))S.visits.push(dayKey());
 save();
}
const known=x=>(S.items[x.id]?.wins||0)>0;
const retained=x=>(S.items[x.id]?.days.length||0)>=2;
function coverage(p){return [...p.v,...p.g].filter(known).length/(p.v.length+p.g.length)}
function passed(p){const c=S.checks[p.id];return !!c&&c.score>=.8&&c.grammar>=3}
function book2Ready(){const ps=PACKS.filter(p=>p.book===1),words=ps.flatMap(p=>p.v);return ps.every(p=>passed(p)&&coverage(p)>=.7)&&words.filter(retained).length/words.length>=.7}
function unlocked(p){if(p.book===2&&!book2Ready())return false;return p.id===1||passed(PACKS[p.id-2])&&coverage(PACKS[p.id-2])>=.7}
function available(){return PACKS.filter(unlocked)}
function currentPack(){return available().find(p=>!passed(p)||coverage(p)<.7)||available().at(-1)}
function dueItems(){return ALL.filter(x=>unlocked(PACKS[x.pack-1])&&S.items[x.id]&&S.items[x.id].due<=Date.now())}
function checkReady(p){return unlocked(p)&&coverage(p)>=.7}
function shuffled(a){return [...a].sort(()=>0).map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x)}
function normalize(s){return s.normalize("NFKC").replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s。、！？!?・]/g,"").toLowerCase()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ==========================================================

   Every question points to one stable curriculum item.
   ========================================================== */
const GAMES={};
function registerGame(id,spec){GAMES[id]=spec}
function chooseOptions(answer,candidates){return shuffled([answer,...shuffled([...new Set(candidates)].filter(x=>x!==answer)).slice(0,3)])}
function wordPool(x){return available().flatMap(p=>p.v).filter(v=>v.type===x.type)}
registerGame("words",{icon:"◈",title:"Word garden",desc:"Recognize words in both directions.",items:()=>available().flatMap(p=>p.v),
 question(x){
  const reverse=Math.random()<.4,pool=wordPool(x);
  return {item:x,mode:"choice",label:reverse?"Choose the Japanese":"Choose the meaning",prompt:reverse?x.en:x.jp,reading:reverse?"":x.kana,answer:reverse?x.jp:x.en,
   options:chooseOptions(reverse?x.jp:x.en,pool.map(v=>reverse?v.jp:v.en)),explain:`${x.jp}（${x.kana}） — ${x.en}`};
 }});
registerGame("recall",{icon:"⌨",title:"Recall room",desc:"Type the reading from memory. Kana or kanji accepted.",items:()=>available().flatMap(p=>p.v),
 question:x=>({item:x,mode:"type",label:"Recall the Japanese · use your Japanese keyboard",prompt:x.en,answer:x.kana,accept:[x.kana,x.jp],explain:`${x.jp}（${x.kana}） — ${x.en}`})});
registerGame("opposites",{icon:"⇄",title:"Opposite alley",desc:"Find the other end: big ↔ small, quiet ↔ lively.",items(){
 const words=available().flatMap(p=>p.v);return words.filter(x=>PAIRS.some(p=>p.includes(x.jp)&&words.some(y=>y.jp===p.find(z=>z!==x.jp))));
 },question(x){
 const pair=PAIRS.find(p=>p.includes(x.jp)),target=available().flatMap(p=>p.v).find(v=>v.jp===pair.find(z=>z!==x.jp));
 return {item:x,mode:"choice",label:"Choose the opposite",prompt:x.jp,reading:S.prefs.reading?`${x.kana} · ${x.en}`:x.en,answer:target.jp,
 options:chooseOptions(target.jp,available().flatMap(p=>p.v).filter(v=>v.type===target.type).map(v=>v.jp)),explain:`${x.jp}（${x.en}） ↔ ${target.jp}（${target.kana} · ${target.en}）`};
 }});
registerGame("calendar",{icon:"▦",title:"Calendar café",desc:"Dates, weekdays, time, people, and general counters.",items:()=>available().flatMap(p=>p.v).filter(x=>["calendar","counter","time"].includes(x.type)),
 question(x){return {item:x,mode:"choice",label:"Choose the reading",prompt:x.jp,reading:x.en,answer:x.kana,options:chooseOptions(x.kana,wordPool(x).map(v=>v.kana)),explain:`${x.jp} → ${x.kana} · ${x.en}. Calendar dates and counters have irregular readings.`}}});
registerGame("patterns",{icon:"◌",title:"Pattern lab",desc:"Choose a particle or form, then learn why it fits.",items:()=>available().flatMap(p=>p.g),
 question:x=>({item:x,mode:"choice",label:"Complete the sentence",prompt:x.tokens.map((t,i)=>i===x.blank?"＿＿":t).join(""),reading:x.en,answer:x.answer,options:shuffled([x.answer,...x.other]),explain:x.note})});
registerGame("builder",{icon:"▤",title:"Sentence studio",desc:"Rebuild a model sentence from shuffled tiles.",items:()=>available().flatMap(p=>p.g),
 question:x=>({item:x,mode:"order",label:"Rebuild the model · tap tiles, tap again to undo",prompt:x.en,reading:"",answer:x.jp,tokens:x.tokens,explain:`${x.jp} — ${x.note}`})});

   SESSION ENGINE
   Finite rounds, explanations, optional corrections, no timer.
   ========================================================== */
let view="today",book=1,Q=null,round=null,answered=false,selected=[],toastTimer;
function makeQuestion(x,mode){
 if(x.kind==="kana")return {item:x,mode:"choice",label:`${x.type} refresher`,prompt:x.jp,reading:"",answer:x.en,options:chooseOptions(x.en,KANA.map(k=>k.en)),explain:`${x.jp} → ${x.en}. を is usually pronounced o as a particle; ぢ/ヂ and づ/ヅ normally sound like ji and zu.`};
 return GAMES[mode|| (x.kind==="grammar"?"patterns":"words")].question(x);
}
function nextReviewOrder(a){
 return shuffled(a).sort((a,b)=>{
  const sa=S.items[a.id],sb=S.items[b.id];
  const priority=x=>!x?1:x.due<=Date.now()?0:2;
  return priority(sa)-priority(sb)||(sa?.due||0)-(sb?.due||0);
 });
}
function startRound(title,questions,opts={}){
 if(!questions.length){toast("This game needs more unlocked content. Continue your current pack.");return}
 S.sessions++;save();
 round={title,questions,at:0,correct:0,grammarCorrect:0,results:[],opts,start:Date.now()};
 Q=null;nextQuestion();
}
function startDaily(){
 const remaining=Math.max(0,S.prefs.goal-(S.daily[dayKey()]||0));
 if(!remaining){renderDoneToday();return}
 const p=currentPack(),pool=nextReviewOrder([...dueItems(),...p.v,...p.g]),seen=new Set(),chosen=[];
 for(const x of pool){if(!seen.has(x.id)){chosen.push(x);seen.add(x.id)}if(chosen.length>=remaining)break}

 if(!file)return;
 if(file.size>2e6){toast("That file is too large for a progress backup.");return}
 try{const next=validateSave(JSON.parse(await file.text()));if(!confirm("Replace progress in this browser with this backup?"))return;S=next;save();renderSettings();toast("Progress imported.")}
 catch(e){toast("Could not import: this is not a valid Hitoiki progress backup.")}
}
document.addEventListener("keydown",e=>{
 if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
 if(!round||round.finished||!Q)return;
 if(e.target.matches("input,textarea,select"))return;
 if(answered&&e.key==="Enter"){e.preventDefault();advance();return}
 if(!answered&&Q.mode==="choice"&&/^[1-4]$/.test(e.key)&&document.getElementById("interaction")){e.preventDefault();choose(Number(e.key)-1)}
});
/* Small content checks run before showing the app. */
function validateContent(){
 const ids=new Set();
 for(const x of [...ALL,...KANA]){
  if(ids.has(x.id)||!x.jp||!x.en)throw Error("Invalid content entry");
  ids.add(x.id);
  if(x.kind==="grammar"&&(!x.answer||x.other.includes(x.answer)||new Set(x.other).size!==3))throw Error("Invalid grammar options");
 }
 if(dateRead.length!==31||monthRead.length!==12||kanaH.length!==kanaR.length||PACKS.length!==23)throw Error("Incomplete content structure");
}
window.Hitoiki={PACKS,GAMES,addPack,registerGame};
try{validateContent();go("today");if(!storageOK)toast("Browser storage is unavailable or a save could not be read. Export your progress before leaving.")}
catch(e){app.innerHTML='<div class="card"><h2>Content could not load.</h2><p>Please reload a fresh copy of this app.</p></div>';console.error(e)}
</script>
