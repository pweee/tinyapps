</style></head><body><main class="app night" id="app"><div class="room" aria-hidden="true"><div class="window"><div class="sky"></div><div class="stars"></div><div class="orb"></div><div class="cloud"></div><div class="cloud two"></div><div class="mountain"></div><div class="mountain back"></div><div class="rain"></div><div class="mullion v"></div><div class="mullion h"></div></div><div class="window-sill"></div><div class="wall-line"></div><div class="lamp"></div><div class="desk"></div><div class="plant"></div><div class="mug"></div><div class="steam">⌁</div></div><div class="interface"><header class="topbar"><div class="brand">✳ stillroom</div><div class="tools"><button class="tool" id="weather" title="Toggle rain" aria-label="Toggle rain" aria-pressed="false">☀</button><button class="tool" id="sky" title="Toggle day/night" aria-label="Toggle day/night" aria-pressed="true">☾</button><button class="tool" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="true">◐</button><button class="tool" id="sound" title="Rain sound" aria-label="Toggle rain ambience" aria-pressed="false">♫</button><button class="tool" id="settingsBtn" title="Settings" aria-label="Settings" aria-expanded="false">⚙</button></div></header><section class="stage" aria-label="Focus timer"><div class="computer"><div class="bezel"><div class="screen"><nav class="modebar" aria-label="Timer mode"><button class="mode active" data-mode="focus">FOCUS</button><button class="mode" data-mode="short">SHORT</button><button class="mode" data-mode="long">LONG</button></nav><div class="clock" id="clock" role="timer" aria-label="Time remaining">25:00</div><div class="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><div class="actions"><button class="small" id="reset" title="Reset (R)" aria-label="Reset timer">↺</button><button class="mainbtn" id="start">▶ START</button><button class="small" id="skip" title="Next session" aria-label="Next session">↷</button></div></div><div class="chin"><span>STILLROOM / 01</span><span class="led"></span></div></div><div class="stand"></div><div class="base"></div></div></section><footer class="bottom"><span class="session" id="session">✦ 0 sessions today</span><span class="session" id="message" aria-live="polite">one thing at a time</span></footer><aside class="settings" id="settings" hidden><div class="settingtitle">SETTINGS</div><label class="settingrow">Focus minutes <input type="number" id="focusLen" min="1" max="180" inputmode="numeric"></label><label class="settingrow">Short break <input type="number" id="shortLen" min="1" max="60" inputmode="numeric"></label><label class="settingrow">Long break <input type="number" id="longLen" min="1" max="90" inputmode="numeric"></label><label class="settingrow">Auto start next <input type="checkbox" id="auto"></label><label class="settingrow">Completion chime <input type="checkbox" id="chime"></label><p class="hint">Space · start/pause &nbsp; R · reset<br>Saved on this device · works offline</p></aside></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),app=$('app');const defaults={mode:'focus',weather:'sunny',day:'night',theme:'dark',focusLen:25,shortLen:5,longLen:15,completed:0,dayStamp:'',auto:false,chime:true};let old={};try{old=JSON.parse(localStorage.getItem('stillroom-v1')||'{}')}catch{}const s={...defaults,...old},stamp=()=>new Date().toLocaleDateString('en-CA');if(s.dayStamp!==stamp()){s.completed=0;s.dayStamp=stamp()}let total=0,left=0,running=false,endAt=0,interval=null,audio=null;const lengths={focus:'focusLen',short:'shortLen',long:'longLen'};function save(){try{localStorage.setItem('stillroom-v1',JSON.stringify(s))}catch{}}function time(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function draw(){const t=time(left),pct=Math.max(0,Math.min(100,Math.round(100*(1-left/total))));$('clock').textContent=t;$('fill').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);$('start').textContent=running?'Ⅱ PAUSE':'▶ START';$('session').textContent='✦ '+s.completed+' session'+(s.completed===1?'':'s')+' today';document.title=t+' · stillroom'}function stop(){running=false;clearInterval(interval);interval=null}function reset(){stop();total=s[lengths[s.mode]]*60;left=total;$('message').textContent=s.mode==='focus'?'one thing at a time':'take it easy';draw()}function setMode(mode){s.mode=mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));save();reset()}function next(){return s.mode==='focus'?(s.completed%4===0?'long':'short'):'focus'}function chime(){if(!s.chime)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(523,ctx.currentTime);osc.frequency.setValueAtTime(659,ctx.currentTime+.16);g.gain.setValueAtTime(.04,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.5);osc.connect(g).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.5);setTimeout(()=>ctx.close(),900)}catch{}}function finish(){stop();left=0;if(s.mode==='focus')s.completed++;save();draw();chime();$('message').textContent='session complete ✦';if(s.auto){setMode(next());start()}}function tick(){left=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(!left)finish();else draw()}function start(){if(!left)reset();running=true;endAt=Date.now()+left*1000;interval=setInterval(tick,250);$('message').textContent=s.mode==='focus'?'in the zone':'on a break';draw()}function toggle(){if(running){tick();if(running){stop();$('message').textContent='paused';draw()}}else start()}function scene(){app.classList.toggle('night',s.day==='night');app.classList.toggle('day',s.day==='day');app.classList.toggle('rainy',s.weather==='rainy');app.classList.toggle('light',s.theme==='light');$('weather').textContent=s.weather==='rainy'?'☂':'☀';$('weather').setAttribute('aria-pressed',String(s.weather==='rainy'));$('sky').textContent=s.day==='night'?'☾':'☼';$('sky').setAttribute('aria-pressed',String(s.day==='night'));$('theme').setAttribute('aria-pressed',String(s.theme==='dark'));save()}$('weather').onclick=()=>{s.weather=s.weather==='rainy'?'sunny':'rainy';scene()};$('sky').onclick=()=>{s.day=s.day==='night'?'day':'night';scene()};$('theme').onclick=()=>{s.theme=s.theme==='dark'?'light':'dark';scene()};$('settingsBtn').onclick=()=>{const open=$('settings').hidden;$('settings').hidden=!open;$('settingsBtn').setAttribute('aria-expanded',String(open))};document.addEventListener('pointerdown',e=>{if(!$('settings').hidden&&!$('settings').contains(e.target)&&!$('settingsBtn').contains(e.target)){$('settings').hidden=true;$('settingsBtn').setAttribute('aria-expanded','false')}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('start').onclick=toggle;$('reset').onclick=reset;$('skip').onclick=()=>setMode(next());for(const [id,max] of [['focusLen',180],['shortLen',60],['longLen',90]]){const el=$(id);el.value=s[id];el.onchange=()=>{s[id]=Math.max(1,Math.min(max,Math.round(Number(el.value)||defaults[id])));el.value=s[id];save();if(lengths[s.mode]===id)reset()}}for(const id of ['auto','chime']){$(id).checked=!!s[id];$(id).onchange=()=>{s[id]=$(id).checked;save()}}$('sound').onclick=async()=>{if(audio){await audio.close();audio=null;$('sound').setAttribute('aria-pressed','false');return}try{audio=new(window.AudioContext||window.webkitAudioContext)();const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=buffer;src.loop=true;filter.type='lowpass';filter.frequency.value=850;gain.gain.value=.11;src.connect(filter).connect(gain).connect(audio.destination);src.start();$('sound').setAttribute('aria-pressed','true')}catch{audio=null}};document.addEventListener('keydown',e=>{if(e.target.closest('button,input,textarea'))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey)reset();if(e.key==='Escape'){$('settings').hidden=true;$('settingsBtn').setAttribute('aria-expanded','false')}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)tick()});scene();setMode(s.mode);save()})();
</script></body></html>
